# Só neste repositório de teste: roda o APK num emulador Android e testa o modo persistente.
name: E2E Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Compilar o APK
        run: cd android && bash gradlew --no-daemon assembleRelease
      - name: Ligar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador Android 15 (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash e2e/teste-persistente.sh android/app/build/outputs/apk/release/app-release.apk
      - name: Guardar telas e arquivos do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-saida
          path: e2e/saida
